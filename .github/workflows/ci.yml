name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # every Monday: catch a new NetBox release that breaks the plugin
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      # The same hooks as on `git commit` (tests run in their own job below).
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: unit-tests

  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install commitizen
      - run: cz check --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  tests:
    name: Tests (NetBox ${{ matrix.netbox }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write  # test report
      pull-requests: write  # test report comment on PRs
    strategy:
      fail-fast: false
      matrix:
        netbox: [pinned, latest]  # pinned = .netbox-version, latest = newest NetBox release
    # A new NetBox release may break the plugin; that must not block unrelated changes.
    continue-on-error: ${{ matrix.netbox == 'latest' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports: ["5432:5432"]
        # -U/-d: without them pg_isready connects as "root" and PostgreSQL logs
        # 'role "root" does not exist' on every check.
        options: >-
          --health-cmd "pg_isready -U netbox -d netbox"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the NetBox version
        id: netbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.netbox }}" = "latest" ]; then
            version=$(gh release view --repo netbox-community/netbox --json tagName --jq .tagName)
          else
            version=$(cat .netbox-version)
          fi
          echo "NetBox $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: netbox-community/netbox
          ref: ${{ steps.netbox.outputs.version }}
          path: .netbox

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .netbox/requirements.txt

      - name: Install NetBox and the plugin
        run: |
          sed 's/psycopg\[c,pool\]/psycopg[binary,pool]/' .netbox/requirements.txt > .netbox/requirements-tests.txt
          pip install -r .netbox/requirements-tests.txt
          pip install -e . pytest pytest-django

      # Optional plugin for the BGP sync tests (skipped without it). Its releases are
      # tied to NetBox versions: keep this in step with .netbox-version.
      - name: Install netbox-bgp
        if: matrix.netbox == 'pinned'
        run: pip install "netbox-bgp>=0.20,<0.21"

      - name: Run unit and integration tests
        run: pytest --junit-xml=reports/junit.xml
        env:
          NETBOX_PATH: .netbox

      - name: Publish test report
        if: always() && matrix.netbox == 'pinned'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/junit.xml
          check_name: Test results
          comment_mode: ${{ github.event_name == 'pull_request' && 'always' || 'off' }}
