# Checks run on every `git commit` (after `poetry run pre-commit install`) and in CI.
# Run them by hand with: poetry run pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3  # keep in sync with ruff in pyproject.toml
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # Commit messages must follow Conventional Commits (feat:, fix:, docs:, ...):
  # commitizen derives the next version and the changelog from them.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Unit tests take about a second; integration tests run in CI (see CONTRIBUTING.md).
  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests
        entry: poetry run pytest tests/unit -q
        language: system
        pass_filenames: false
        types: [python]
