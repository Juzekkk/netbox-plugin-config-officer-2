[project]
name = "netbox-plugin-config-officer-2"
version = "0.5.0"
description = "NetBox plugin that collects Cisco running configs, versions them in Git, syncs device data into NetBox and audits compliance"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
authors = [
    { name = "Michal Juskiewicz", email = "m.juskiewicz66@gmail.com" },
    { name = "Sergei Artemov", email = "artemov.sergey1989@gmail.com" },
]
keywords = ["netbox", "netbox-plugin", "cisco", "configuration", "compliance"]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]
dependencies = [
    "scrapli>=2024.1.30,<2026.0",
    "GitPython>=3.1,<4.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/Juzekkk/netbox-plugin-config-officer-2"
Changelog = "https://github.com/Juzekkk/netbox-plugin-config-officer-2/blob/main/CHANGELOG.md"
Issues = "https://github.com/Juzekkk/netbox-plugin-config-officer-2/issues"

[tool.poetry]
packages = [{ include = "config_officer" }]
include = [{ path = "config_officer/templates/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-django = ">=4.8"
ruff = "0.17.3"          # keep in sync with .pre-commit-config.yaml
pre-commit = ">=3.7"
commitizen = ">=4.6"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["config_officer/migrations"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "TID",     # flake8-tidy-imports (absolute imports)
    "PL",      # pylint subset
]
ignore = [
    "E501",    # line length: left to the formatter
    "PLR0913", # too many arguments
    "PLR0917", # too many positional arguments
    "PLC0415", # deliberate local imports: AppConfig.ready(), circular imports, optional Django
    "PLR2004", # magic values
]

[tool.ruff.lint.isort]
known-first-party = ["config_officer", "tests"]

# ---------------------------------------------------------------------------
# Pytest - see CONTRIBUTING.md ("Tests")
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--tb=short", "--strict-markers", "-p", "no:cacheprovider"]
filterwarnings = [
    # third-party (django-taggit) deprecation, not ours
    "ignore:SQLCompiler.quote_name_unless_alias",
    # netbox-bgp's own GraphQL code (installed for the BGP tests)
    "ignore::DeprecationWarning:netbox_bgp",
]

# ---------------------------------------------------------------------------
# Commitizen - version bumps and CHANGELOG.md (see CONTRIBUTING.md, "Releasing")
# ---------------------------------------------------------------------------

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"     # the version lives only in [project].version
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true       # in 0.x a BREAKING CHANGE bumps the minor version
